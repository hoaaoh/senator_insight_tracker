<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>議會質詢校正任務清單</title>
    <link rel="stylesheet" href="./review.css" />
  </head>
  <body>
    <header class="review-header">
      <div>
        <p class="eyebrow">Review Queue</p>
        <h1>議會質詢校正任務清單</h1>
        <p id="reviewHomeMeta" class="meta-line">載入影片與片段清單中...</p>
      </div>
      <div class="header-actions">
        <a class="back-link" href="../index.html">回到總覽</a>
      </div>
    </header>

    <main class="review-home-shell">
      <aside class="review-home-panel">
        <div class="progress-card">
          <strong id="targetCount">0</strong>
          <span>可追蹤影片/片段</span>
          <div class="progress-bar"><span id="readyBar"></span></div>
        </div>

        <label class="field-label" for="targetSearch">搜尋</label>
        <input id="targetSearch" placeholder="搜尋議員、影片、日期或議題" />

        <label class="field-label" for="yearFilter">年度</label>
        <select id="yearFilter"></select>

        <label class="field-label" for="issueFilter">分類</label>
        <select id="issueFilter"></select>

        <label class="field-label" for="statusFilter">狀態</label>
        <select id="statusFilter">
          <option value="all">全部</option>
          <option value="ready">可校正</option>
          <option value="draft">進行中</option>
          <option value="done">已審閱</option>
          <option value="excluded">已排除</option>
          <option value="asr_waiting">ASR 待處理</option>
        </select>

        <section class="task-panel" aria-label="清單分組">
          <div class="task-heading">
            <p class="eyebrow">Group By</p>
            <h2>排列方式</h2>
          </div>
          <div class="task-tabs three-tabs" role="group" aria-label="任務分組">
            <button id="homeGroupByCouncilor" type="button">依議員</button>
            <button id="homeGroupByYear" class="active" type="button">依年度</button>
            <button id="homeGroupByIssue" type="button">依分類</button>
          </div>
        </section>
      </aside>

      <section class="target-workbench" aria-label="影片片段清單">
        <div class="target-heading">
          <div>
            <p class="eyebrow">May - June Batch</p>
            <h2>先選一支影片或片段</h2>
          </div>
          <span id="filteredCount" class="pill">--</span>
        </div>
        <div id="targetList" class="target-list"></div>
      </section>
    </main>

    <script src="../data.js"></script>
    <script src="./review-home.js"></script>
  </body>
</html>
